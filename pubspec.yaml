name: lesroisdusahel
description: "Application mobile officielle du Complexe Scolaire Privé Les Rois du Sahel."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_roi.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#3B0764"
  adaptive_icon_foreground: "assets/images/logo_roi.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
